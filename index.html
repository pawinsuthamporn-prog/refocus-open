<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Open Refocus</title>
<style>
  :root {
    --bg: #0b0c0e;
    --card: #16181c;
    --line: #262a30;
    --fg: #f2f4f7;
    --muted: #9aa3ad;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .mark {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: linear-gradient(160deg, #3a6bff, #7a4dff);
    display: grid; place-items: center;
    font-size: 30px;
    box-shadow: 0 12px 30px rgba(90,120,255,.25);
  }
  h1 { font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -0.02em; }
  p.sub { margin: 0; color: var(--muted); font-size: 15px; max-width: 30ch; }
  a.open {
    display: block;
    width: 100%;
    max-width: 340px;
    padding: 18px 24px;
    border-radius: 16px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    box-shadow: 0 10px 24px rgba(91,140,255,.3);
    transition: transform .12s ease, opacity .12s ease;
  }
  a.open:active { transform: scale(.975); opacity: .9; }
  .fallback {
    width: 100%; max-width: 340px;
    border-top: 1px solid var(--line);
    padding-top: 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .fallback a { color: var(--accent); text-decoration: none; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--fg);
  }
</style>
</head>
<body>
  <div class="mark">◎</div>

  <div>
    <h1>Open Refocus</h1>
    <p class="sub">Launches the Refocus app blocker straight from this link.</p>
  </div>

  <!-- Real link tap: iOS hands custom schemes to the app natively -->
  <a class="open" href="refocus://" id="openBtn">Open Refocus</a>

  <div class="fallback">
    Nothing happened? The app isn't installed, or you're in an in-app browser
    (Instagram, Gmail, etc.) that blocks app links — tap
    <strong>Open in Safari</strong> first, or
    <a href="https://apps.apple.com/app/id1645639057">get Refocus on the App Store</a>.
    <br><br>
    Raw URL: <code>refocus://</code>
  </div>

<script>
  // Second attempt path: if the anchor tap is swallowed, force navigation on click.
  document.getElementById('openBtn').addEventListener('click', function (e) {
    e.preventDefault();
    window.location.href = 'refocus://';
  });
</script>
</body>
</html>
